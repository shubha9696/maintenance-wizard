services:
  - type: web
    name: maintenance-wizard-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: true
      - key: GEMINI_API_KEY
        sync: true
      - key: CHROMA_DB_PATH
        value: ./chroma_db
      - key: BACKEND_PORT
        value: 8000
